name: kinopio-hub-ros-check

services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-p", "4222", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/varz >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 15

  bridge:
    build:
      context: ..
      dockerfile: docker/bridge/Dockerfile
      args:
        ROS_BASE_IMAGE: ${ROS_BASE_IMAGE:-ros:humble-ros-base-jammy}
    working_dir: /workspace
    command: ["bash", "-lc", "sleep infinity"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    depends_on:
      nats:
        condition: service_healthy
