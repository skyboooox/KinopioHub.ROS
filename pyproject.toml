[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinopio-hub-ros"
version = "0.1.0"
description = "ROS <-> NATS message bridge for KinopioHub"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name = "Skybox" },
]
dependencies = [
  "nats-py[nkeys]>=2.14,<3",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
]

[project.scripts]
kinopio-hub-ros = "kinopio_hub_ros.entry.cli:main"

[tool.pytest.ini_options]
addopts = "-ra -p no:cacheprovider"
testpaths = ["tests"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
